name: swap_identity_preservation
description: "Basic face swap with Balanced preset — validates identity is preserved"
type: visual_quality
priority: critical
tags: [identity, core, balanced]
setup:
  source_image: source_faces/default.png
  target_image: target_frames/default.png
  preset: balanced
assertions:
  metrics:
    - metric: identity_similarity
      operator: ">="
      value: 0.65
    - metric: ssim
      operator: ">="
      value: 0.70
    - metric: blur_score
      operator: ">="
      value: 0.3
    - metric: artifact_score
      operator: "<="
      value: 0.3
  llm_judge:
    enabled: true
    model: claude-sonnet-4-20250514
    min_samples: 3
    dimensions:
      identity_preservation: 6.0
      boundary_blending: 5.0
      lighting_consistency: 5.0
      expression_naturalness: 5.0
      uncanny_valley: 5.0
